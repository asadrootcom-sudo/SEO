<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريحة 9 - SEO Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seo9.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">9 / 16</div>

    <!-- Main Container -->
    <div class="slide-container">
        <div class="slide-content">
            <div class="header-section">
                <h1 class="slide-title">قصة نجاح واقعية</h1>
            </div>

            <!-- Company Badge -->
            <div class="company-badge">
                <div class="badge-content">
                    <span class="badge-text">شركة خدمات في جدة</span>
                </div>
            </div>

            <!-- Comparison Container -->
            <div class="comparison-container">
                <!-- Before SEO Card -->
                <div class="phase-card before">
                    <div class="phase-header">
                        <div class="phase-title">قبل SEO</div>
                    </div>
                    <ul class="results-list">
                        <li class="result-item">
                            <span class="result-bullet"><i class="ph ph-x"></i></span>
                            <span>موقع بدون زوار</span>
                        </li>
                        <li class="result-item">
                            <span class="result-bullet"><i class="ph ph-x"></i></span>
                            <span>اعتماد 100% على الإعلانات</span>
                        </li>
                        <li class="result-item">
                            <span class="result-bullet"><i class="ph ph-x"></i></span>
                            <span>تكلفة عالية ونتائج متذبذبة</span>
                        </li>
                    </ul>
                </div>

                <!-- Arrow Badge -->
                <div class="arrow-badge"><i class="ph ph-arrow-bend-double-up-left"></i></div>

                <!-- After SEO Card -->
                <div class="phase-card after">
                    <div class="phase-header">
                        <div class="phase-title">بعد 6 أشهر من SEO</div>
                    </div>
                    <ul class="results-list">
                        <li class="result-item">
                            <span class="result-bullet"><i class="ph ph-checks"></i></span>
                            <span>+500 زائر يومياً من جوجل</span>
                        </li>
                        <li class="result-item">
                            <span class="result-bullet"><i class="ph ph-checks"></i></span>
                            <span>80% من العملاء يجون طبيعيين</span>
                        </li>
                        <li class="result-item">
                            <span class="result-bullet"><i class="ph ph-checks"></i></span>
                            <span>أرباح تضاعفت 3 مرات</span>
                        </li>
                        <li class="result-item">
                            <span class="result-bullet"><i class="ph ph-checks"></i></span>
                            <span>استقلالية كاملة عن الإعلانات</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
        <button class="nav-btn prev" onclick="location.href='../SEO8/seo8.html'">السابق</button>
        <button class="nav-btn next" onclick="location.href='../SEO10/seo10.html'">التالي</button>
    </div>

    <script>
        // Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                location.href = 'slide_10.html';
            } else if (e.key === 'ArrowLeft') {
                location.href = 'slide_8.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                location.href = 'slide_10.html';
            }
            if (touchEndX > touchStartX + 50) {
                location.href = 'slide_8.html';
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</body>
</html>
