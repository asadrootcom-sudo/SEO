<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريحة 14 - SEO Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seo14.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">14 / 17</div>

    <!-- Main Container -->
    <div class="slide-container">
        <div class="slide-content">
            <div class="header-section">
                <h1 class="slide-title">تصور مستقبلك بعد SEO</h1>
            </div>

            <!-- Intro Text -->
            <div class="intro-text">كل يوم تستيقظ على:</div>

            <!-- Vision List -->
            <ul class="vision-list">
                <li class="vision-item">
                    <span class="bullet-icon">•</span>
                    <span class="vision-text">عملاء جدد تواصلوا معك الليلة</span>
                </li>
                <li class="vision-item">
                    <span class="bullet-icon">•</span>
                    <span class="vision-text">طلبات جديدة بدون ما دفعت إعلان</span>
                </li>
                <li class="vision-item">
                    <span class="bullet-icon">•</span>
                    <span class="vision-text">مشروع ينمو بثبات واستقرار</span>
                </li>
                <li class="vision-item">
                    <span class="bullet-icon">•</span>
                    <span class="vision-text">اسمك يلمع في السوق</span>
                </li>
                <li class="vision-item">
                    <span class="bullet-icon">•</span>
                    <span class="vision-text">منافسينك يتساءلون: "وش سر نجاحه؟"</span>
                </li>
            </ul>

            <!-- Closing Message -->
            <div class="closing-message">
                <p class="closing-text">
                    هذا ممكن… <span class="highlight">وأقرب مما تتخيل!</span> 
                </p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
        <button class="nav-btn prev" onclick="location.href='../SEO13/seo13.html'">السابق</button>
        <button class="nav-btn next" onclick="location.href='../SEO15/seo15.html'">التالي</button>
    </div>

    <script>
        // Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                location.href = 'slide_15.html';
            } else if (e.key === 'ArrowLeft') {
                location.href = 'slide_13.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                location.href = 'slide_15.html';
            }
            if (touchEndX > touchStartX + 50) {
                location.href = 'slide_13.html';
            }
        }
    </script>
</body>
</html>
