<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريحة 16 - SEO Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seo16.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">16 / 17</div>

    <!-- Main Container -->
    <div class="slide-container">
        <div class="slide-content">

            <!-- Title -->
            <h1 class="slide-title">هدفنا الحقيقي</h1>

            <!-- Quote Box -->
            <div class="quote-box">
                <span class="quote-mark">"</span>
                <p class="quote-text">
                    مو هدفنا نطلعك في جوجل…<br><br>
                    هدفنا <span class="quote-highlight">نجيب لك عملاء حقيقيين</span><br>
                    يشترون منك… يعودون لك…<br>
                    ويوصونك لغيرهم
                </p>
            </div>

            <!-- CTA Section -->
            <div class="cta-section">
                <span class="cta-icon"><i class="ph ph-phone-call"></i></span>
                <p class="cta-text">تواصل معنا اليوم</p>
                <p class="cta-subtext">وابدأ رحلة نمو مشروعك </p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
        <button class="nav-btn prev" onclick="location.href='../SEO15/seo15.html'">السابق</button>
        <button class="nav-btn next" onclick="location.href='../SEO17/seo17.html'">الباقات</button>
    </div>

    <script>
        // Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                location.href = 'slide_1.html';
            } else if (e.key === 'ArrowLeft') {
                location.href = 'slide_15.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                location.href = 'slide_1.html';
            }
            if (touchEndX > touchStartX + 50) {
                location.href = 'slide_15.html';
            }
        }
    </script>
</body>
</html>
