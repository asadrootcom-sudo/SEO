<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريحة 2 - SEO Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="seo2.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">2 / 16</div>

    <!-- Main Container -->
    <div class="slide-container">
        <div class="slide-content">
            <div class="header-section">
                <div class="problem-icon color-icon-beg"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h1 class="slide-title">المشكلة الحقيقية</h1>
            </div>

            <ul class="problems-list">
                <li class="problem-item">
                    <span class="problem-icon-small"><i class="ph ph-globe"></i></span>
                    <span class="problem-text">عندك موقع… لكن ما فيه زوار؟</span>
                </li>
                <li class="problem-item">
                    <span class="problem-icon-small"><i class="ph ph-megaphone"></i></span>
                    <span class="problem-text">تعتمد فقط على الإعلانات المدفوعة؟</span>
                </li>
                <li class="problem-item">
                    <span class="problem-icon-small"><i class="ph ph-chart-line-down"></i></span>
                    <span class="problem-text">كل ما توقف الإعلان… توقف العملاء؟</span>
                </li>
                <li class="problem-item">
                    <span class="problem-icon-small"><i class="ph ph-globe-x"></i></span>
                    <span class="problem-text">تشعر أن موقعك "مجرد واجهة" بدون قيمة حقيقية؟</span>
                </li>
            </ul>

            <!-- Navigation -->
            <div class="navigation">
                <button class="nav-btn prev" onclick="location.href='../index.html'">السابق</button>
                <button class="nav-btn next" onclick="location.href='../SEO3/seo3.html'">التالي</button>
            </div>
            
        </div>
    </div>

    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <script>
        // Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                location.href = 'slide_3.html';
            } else if (e.key === 'ArrowLeft') {
                location.href = 'slide_1.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                location.href = 'slide_3.html';
            }
            if (touchEndX > touchStartX + 50) {
                location.href = 'slide_1.html';
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</body>
</html>
