<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع التعلم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #0a0f1a; color: #f1f5f9; min-height: 100vh; }
        .glass { background: rgba(26,34,53,0.9); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); }
        .btn:active { transform: scale(0.97); }
        input:focus, textarea:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .modal-box { background: #1a2235; border-radius: 1.5rem; padding: 2rem; width: 100%; max-width: 28rem; max-height: 90vh; overflow-y: auto; }
        @keyframes fade { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .anim { animation: fade 0.3s ease; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        .folder-card { transition: all 0.3s ease; cursor: pointer; }
        .folder-card:hover { transform: translateY(-6px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, createContext, useContext } = React;

// === الألوان ===
const COLORS = [
    {name:'emerald',val:'#10b981'}, {name:'amber',val:'#f59e0b'}, {name:'rose',val:'#f43f5e'},
    {name:'violet',val:'#8b5cf6'}, {name:'cyan',val:'#06b6d4'}, {name:'orange',val:'#fb923c'},
    {name:'pink',val:'#ec4899'}, {name:'lime',val:'#84cc16'}
];

// === مساعدات ===
const uid = () => Math.random().toString(36).slice(2,9);
const getYtId = (url) => {
    if(!url) return null;
    const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|embed\/)([^&\n?#]+)/);
    return m ? m[1] : null;
};

// === تخزين البيانات ===
const DB = {
    get(key) { try { return JSON.parse(localStorage.getItem(key)||'[]'); } catch(e){ return []; } },
    set(key,val) { localStorage.setItem(key, JSON.stringify(val)); },
    getUser() {
        let u = localStorage.getItem('lt_user_v2');
        if(!u){ u='u_'+uid(); localStorage.setItem('lt_user_v2',u); }
        return u;
    }
};

// === Context ===
const Ctx = createContext();

function useStore() {
    const [folders,setFolders] = useState([]);
    const [books,setBooks] = useState([]);
    const [videos,setVideos] = useState([]);
    const [ready,setReady] = useState(false);
    const user = DB.getUser();

    useEffect(() => {
        const allF = DB.get('folders').filter(x=>x.u===user);
        const allB = DB.get('books').filter(x=>x.u===user);
        const allV = DB.get('videos').filter(x=>x.u===user);
        setFolders(allF); setBooks(allB); setVideos(allV); setReady(true);
    },[user]);

    const save = useCallback((f,b,v) => {
        setFolders(f); setBooks(b); setVideos(v);
        DB.set('folders',[...DB.get('folders').filter(x=>x.u!==user),...f]);
        DB.set('books',[...DB.get('books').filter(x=>x.u!==user),...b]);
        DB.set('videos',[...DB.get('videos').filter(x=>x.u!==user),...v]);
    },[user]);

    // === القوائم ===
    const addFolder = d => { const nf={id:uid(),title:d.title,color:d.color,u:user}; save([...folders,nf],books,videos); return nf; };
    const delFolder = id => save(folders.filter(f=>f.id!==id), books.filter(b=>b.fid!==id), videos.filter(v=>!books.find(bk=>bk.id===v.bid && bk.fid===id)));
    
    // === الكتب ===
    const addBook = d => { const nb={id:uid(),title:d.title,color:d.color,fid:d.fid,u:user}; save(folders,[...books,nb],videos); return nb; };
    const delBook = id => { const b=books.find(x=>x.id===id); save(folders,books.filter(b=>b.id!==id), videos.filter(v=>v.bid!==id)); };
    
    // === الفيديوهات ===
    const addVid = d => { const nv={id:uid(),title:d.title,url:d.url,bid:d.bid,u:user,done:false}; save(books,videos,[...videos,nv]); return nv; };
    const toggleVid = id => save(books, videos.map(v=>v.id===id?{...v,done:!v.done}:v));
    const delVid = id => save(books, videos.filter(v=>v.id!==id));
    
    // === الإحصائيات ===
    const getBookProgress = bid => { const vs=videos.filter(v=>v.bid===bid); return vs.length?Math.round(vs.filter(v=>v.done).length/vs.length*100):0; };
    const getFolderProgress = fid => { 
        const fBooks=books.filter(b=>b.fid===fid);
        if(!fBooks.length) return 0;
        let total=0, done=0;
        fBooks.forEach(b=>{ const vs=videos.filter(v=>v.bid===b.id); total+=vs.length; done+=vs.filter(v=>v.done).length; });
        return total?Math.round(done/total*100):0;
    };
    const totalProg = () => videos.length?Math.round(videos.filter(v=>v.done).length/videos.length*100):0;

    return {folders,books,videos,user,ready,addFolder,delFolder,addBook,delBook,addVid,toggleVid,delVid,getBookProgress,getFolderProgress,totalProg};
}

// === شريط التنقل ===
function Nav({page,setPage}) {
    return (
        <nav className="fixed top-0 left-0 right-0 z-50 glass">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3 cursor-pointer" onClick={()=>setPage('home')}>
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-cyan-500 flex items-center justify-center">
                        <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <span className="font-bold text-xl hidden sm:block">تتبع التعلم</span>
                </div>
                <div className="flex gap-2">
                    {['home','progress'].map(p=>{
                        const labels={home:'القوائم',progress:'التقدم'};
                        const icons={home:<path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>,progress:<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>};
                        return (
                            <button key={p} onClick={()=>setPage(p)} className={`flex items-center gap-1 sm:gap-2 px-2 sm:px-4 py-2 rounded-xl font-medium transition btn ${page===p?'bg-emerald-500/20 text-emerald-400':'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={icons[p]}/></svg>
                                <span className="text-xs sm:text-base">{labels[p]}</span>
                            </button>
                        );
                    })}
                </div>
            </div>
        </nav>
    );
}

// === Modal إضافة قائمة ===
function AddFolderModal({open,onClose,onAdd}) {
    const [title,setTitle]=useState('');
    const [color,setColor]=useState('emerald');
    if(!open) return null;
    return (
        <div className="modal-bg" onClick={onClose}>
            <div className="modal-box anim" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-2xl font-bold">إضافة قائمة جديدة</h2>
                    <button onClick={onClose} className="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-gray-400 hover:text-white btn"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
                <form onSubmit={e=>{e.preventDefault();if(title.trim()){onAdd({title:title.trim(),color});setTitle('');setColor('emerald');onClose();}}}>
                    <label className="block text-gray-400 mb-2">اسم القائمة</label>
                    <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="مثال: برمجة الويب، التصميم، اللغات..." className="w-full px-4 py-3 rounded-xl bg-gray-900 border border-white/10 text-white placeholder-gray-500 mb-6" autoFocus/>
                    <label className="block text-gray-400 mb-3">لون القائمة</label>
                    <div className="flex flex-wrap gap-3 mb-8">
                        {COLORS.map(c=>(<button type="button" key={c.name} onClick={()=>setColor(c.name)} className={`w-10 h-10 rounded-full transition ${color===c.name?'ring-2 ring-white ring-offset-2 ring-offset-gray-800':''}`} style={{background:c.val}}/>))}
                    </div>
                    <div className="flex gap-3">
                        <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl bg-white/5 text-gray-400 btn">إلغاء</button>
                        <button type="submit" disabled={!title.trim()} className="flex-1 py-3 rounded-xl bg-gradient-to-l from-emerald-500 to-cyan-500 text-white font-bold disabled:opacity-50 btn">إنشاء القائمة</button>
                    </div>
                </form>
            </div>
        </div>
    );
}

// === Modal إضافة كتاب ===
function AddBookModal({open,onClose,onAdd,folderName}) {
    const [title,setTitle]=useState('');
    const [color,setColor]=useState('emerald');
    if(!open) return null;
    return (
        <div className="modal-bg" onClick={onClose}>
            <div className="modal-box anim" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-2xl font-bold">إضافة كتاب جديد</h2>
                    <button onClick={onClose} className="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-gray-400 hover:text-white btn"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
                <form onSubmit={e=>{e.preventDefault();if(title.trim()){onAdd({title:title.trim(),color});setTitle('');setColor('emerald');onClose();}}}>
                    <p className="text-gray-400 text-sm mb-4">سيتم إضافة الكتاب إلى: <span className="text-emerald-400 font-bold">{folderName}</span></p>
                    <label className="block text-gray-400 mb-2">اسم الكتاب / الكورس</label>
                    <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="مثال: دورة HTML المتقدمة" className="w-full px-4 py-3 rounded-xl bg-gray-900 border border-white/10 text-white placeholder-gray-500 mb-6" autoFocus/>
                    <label className="block text-gray-400 mb-3">لون الكتاب</label>
                    <div className="flex flex-wrap gap-3 mb-8">
                        {COLORS.map(c=>(<button type="button" key={c.name} onClick={()=>setColor(c.name)} className={`w-10 h-10 rounded-full transition ${color===c.name?'ring-2 ring-white ring-offset-2 ring-offset-gray-800':''}`} style={{background:c.val}}/>))}
                    </div>
                    <div className="flex gap-3">
                        <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl bg-white/5 text-gray-400 btn">إلغاء</button>
                        <button type="submit" disabled={!title.trim()} className="flex-1 py-3 rounded-xl bg-gradient-to-l from-violet-500 to-pink-500 text-white font-bold disabled:opacity-50 btn">إضافة الكتاب</button>
                    </div>
                </form>
            </div>
        </div>
    );
}

// === بطاقة قائمة ===
function FolderCard({folder,prog,bookCount,onEnter,onDelete}) {
    const c = COLORS.find(x=>x.name===folder.color)||COLORS[0];
    return (
        <div className="folder-card rounded-2xl p-6 anim" style={{background:c.val+'15',border:`1px solid ${c.val}35`}}>
            <div className="flex justify-between items-start mb-4">
                <div className="w-14 h-14 rounded-2xl flex items-center justify-center" style={{background:c.val+'25'}}>
                    <svg className="w-7 h-7" style={{color:c.val}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                </div>
                <div className="flex gap-2">
                    <span className="font-black text-2xl" style={{color:c.val}}>{prog}%</span>
                    <button onClick={(e)=>{e.stopPropagation();onDelete(folder.id)}} className="w-8 h-8 rounded-lg bg-red-500/20 text-red-400 flex items-center justify-center opacity-0 group-hover:opacity-100 hover:bg-red-500/30 btn">✕</button>
                </div>
            </div>
            <h3 className="font-bold text-xl mb-2">{folder.title}</h3>
            <p className="text-gray-500 text-sm mb-4">{bookCount} كتاب في هذه القائمة</p>
            <div className="h-2 bg-black/20 rounded-full overflow-hidden mb-3">
                <div className="h-full rounded-full transition-all duration-500" style={{width:prog+'%',background:c.val}}/>
            </div>
            <button onClick={onEnter} className="w-full py-2 rounded-xl text-sm font-medium transition" style={{background:c.val+'20',color:c.val}}>فتح القائمة ←</button>
        </div>
    );
}

// === بطاقة كتاب (داخل القائمة) ===
function BookCard({book,prog,onClick}) {
    const c = COLORS.find(x=>x.name===book.color)||COLORS[0];
    return (
        <div onClick={onClick} className="rounded-2xl p-5 cursor-pointer transition hover:-translate-y-1 hover:shadow-xl anim" style={{background:c.val+'18',border:`1px solid ${c.val}40`}}>
            <div className="flex justify-between items-start mb-3">
                <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{background:c.val+'30'}}>
                    <svg className="w-5 h-5" style={{color:c.val}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <span className="text-xl font-bold" style={{color:c.val}}>{prog}%</span>
            </div>
            <h4 className="font-bold text-base mb-3 line-clamp-2">{book.title}</h4>
            <div className="h-2 bg-black/20 rounded-full overflow-hidden">
                <div className="h-full rounded-full transition-all duration-500" style={{width:prog+'%',background:c.val}}/>
            </div>
            <p className="mt-2 text-xs text-gray-500">اضغط للدروس</p>
        </div>
    );
}

// === بطاقة درس ===
function LessonCard({vid,idx,onToggle,onDel}) {
    const ytId = getYtId(vid.url);
    return (
        <div className={`glass rounded-2xl p-5 anim ${vid.done?'opacity-70':''}`}>
            <div className="flex gap-4">
                <div className="flex flex-col items-center gap-2 min-w-[45px]">
                    <span className="text-sm text-gray-500 font-mono">{idx+1}</span>
                    <button onClick={()=>onToggle(vid.id)} className={`w-8 h-8 rounded-lg border-2 flex items-center justify-center transition btn ${vid.done?'bg-emerald-500 border-emerald-500':'border-gray-600 hover:border-emerald-500'}`}>
                        {vid.done && <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="3" d="M5 13l4 4L19 7"/></svg>}
                    </button>
                </div>
                <div className="flex-1">
                    <h4 className={`font-semibold mb-3 ${vid.done?'line-through text-gray-500':''}`}>{vid.title}</h4>
                    {ytId && (
                        <div className="relative rounded-xl overflow-hidden aspect-video max-w-sm mb-3">
                            <img src={`https://img.youtube.com/vi/${ytId}/mqdefault.jpg`} className="w-full h-full object-cover" loading="lazy"/>
                            <div className="absolute inset-0 bg-black/40 flex items-center justify-center">
                                <a href={`https://www.youtube.com/watch?v=${ytId}`} target="_blank" rel="noreferrer" className="w-12 h-12 rounded-full bg-white flex items-center justify-center hover:bg-gray-200 btn">
                                    <svg className="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </a>
                            </div>
                            {vid.done && <div className="absolute top-2 right-2 px-2 py-1 rounded-full bg-emerald-500 text-white text-xs font-bold">تمت</div>}
                        </div>
                    )}
                    <div className="flex gap-2 flex-wrap">
                        {ytId && <a href={`https://www.youtube.com/watch?v=${ytId}`} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-red-500/20 text-red-400 text-sm hover:bg-red-500/30 btn">مشاهدة</a>}
                        <button onClick={()=>onDel(vid.id)} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-white/5 text-gray-500 text-sm hover:bg-red-500/20 hover:text-red-400 btn">حذف</button>
                    </div>
                </div>
            </div>
        </div>
    );
}

// === نموذج إضافة درس ===
function AddLessonForm({bid,onAdd}) {
    const [show,setShow]=useState(false);
    const [title,setTitle]=useState('');
    const [url,setUrl]=useState('');
    if(!show){
        return (
            <button onClick={()=>setShow(true)} className="w-full rounded-2xl p-6 border-2 border-dashed border-violet-500/30 text-center hover:border-violet-500/60 transition btn anim">
                <div className="w-12 h-12 mx-auto mb-2 rounded-xl bg-violet-500/20 flex items-center justify-center">
                    <svg className="w-6 h-6 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
                </div>
                <p className="font-bold">إضافة درس جديد</p>
                <p className="text-xs text-gray-500 mt-1">اضغط لإضافة درس</p>
            </button>
        );
    }
    return (
        <div className="rounded-2xl p-6 border-2 border-dashed border-violet-500/40 bg-violet-500/5 anim">
            <div className="flex justify-between items-center mb-4">
                <h3 className="font-bold flex items-center gap-2"><svg className="w-5 h-5 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M12 4v16m8-8H4"/></svg>إضافة درس</h3>
                <button onClick={()=>setShow(false)} className="w-9 h-9 rounded-lg bg-white/10 flex items-center justify-center text-gray-400 btn"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <form onSubmit={e=>{e.preventDefault();if(title.trim()&&url.trim()){onAdd({title:title.trim(),url:url.trim(),bid});setTitle('');setUrl('');setShow(false);}}}>
                <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="عنوان الدرس" className="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-white/10 text-white placeholder-gray-500 mb-3" autoFocus/>
                <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="رابط يوتيوب" dir="ltr" className="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-white/10 text-white placeholder-gray-500 mb-4"/>
                <div className="flex gap-3">
                    <button type="button" onClick={()=>setShow(false)} className="flex-1 py-3 rounded-xl bg-white/10 text-gray-400 btn">إلغاء</button>
                    <button type="submit" disabled={!title.trim()||!url.trim()} className="flex-1 py-3 rounded-xl bg-gradient-to-l from-violet-500 to-pink-500 text-white font-bold disabled:opacity-50 btn">إضافة</button>
                </div>
            </form>
        </div>
    );
}

// === صفحة تفاصيل الكتاب ===
function BookPage({bid,onBack}) {
    const s = useContext(Ctx);
    const book = s.books.find(b=>b.id===bid);
    const vids = s.videos.filter(v=>v.bid===bid);
    const prog = s.getBookProgress(bid);
    const done = vids.filter(v=>v.done).length;
    const c = book ? COLORS.find(x=>x.name===book.color)||COLORS[0] : COLORS[0];
    if(!book) { useEffect(()=>{ onBack(); },[]); return null; }

    return (
        <div className="min-h-screen pt-20 pb-12 px-4">
            <div className="max-w-3xl mx-auto">
                <div className="glass rounded-2xl p-6 mb-6 anim">
                    <div className="flex items-center gap-4 mb-4">
                        <button onClick={onBack} className="w-11 h-11 rounded-xl bg-white/5 flex items-center justify-center text-gray-400 hover:text-white btn">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                        </button>
                        <div className="flex-1 min-w-0">
                            <h1 className="text-2xl sm:text-3xl font-black truncate">{book.title}</h1>
                            <p className="text-gray-400 mt-1">{vids.length} درس • {prog}% مكتمل</p>
                        </div>
                        <button onClick={()=>{if(confirm('حذف؟')){s.delBook(bid);onBack();}}} className="w-11 h-11 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center hover:bg-red-500/20 btn shrink-0">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

                </div>

                <div className="space-y-4">
                    {vids.length>0 ? (<><h2 className="font-bold text-xl text-gray-300">الدروس</h2>{vids.map((v,i)=><LessonCard key={v.id} vid={v} idx={i} onToggle={s.toggleVid} onDel={s.delVid}/>)}</>) : (

// === صفحة القائمة (داخلها الكتب) ===

                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M12 4v16m8-8H4"/></svg>

// === الصفحة الرئيسية (القوائم) ===

                            <svg className="w-14 h-14 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                        </div>
                        <h2 className="text-2xl font-bold mb-3">أنشئ قائمتك الأولى</h2>
                        <p class="text-gray-400 mb-8 max-w-md mx-auto">نظم كتبك ودورسك في قوائم مرتبة</p>
                        <button onClick={()=>setModal(true)} className="inline-flex items-center gap-2 px-8 py-4 rounded-xl bg-gradient-to-l from-emerald-500 to-cyan-500 text-white font-bold text-lg hover:shadow-lg btn">

                            إنشاء قائمة

// === صفحة الإحصائيات ===

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                    {[{l:'التقدم',v:tp+'%',c:'emerald',i:<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>},

                      {l:'الكتب',v:s.books.length,c:'cyan',i:<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>},
                      {l:'مكتمل',v:done,c:'amber',i:<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>}]
                      .map((x,i)=>(
                        <div key={i} className="glass rounded-2xl p-5">
                            <div className={`text-${x.c}-400 mb-2`}><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d={x.i}/></svg></div>
                            <div className="text-3xl font-bold">{x.v}</div>
                            <div className="text-sm text-gray-400">{x.l}</div>
                        </div>
                    ))}
                </div>

                <div className="glass rounded-2xl p-8 mb-6 text-center">
                    <h3 className="text-xl font-bold mb-6">نسبة الإنجاز</h3>
                    <div className="relative w-48 h-48 mx-auto">
                        <svg className="w-full h-full -rotate-90" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="52" fill="none" stroke="#1a2235" strokeWidth="12"/>
                            <circle cx="60" cy="60" r="52" fill="none" stroke="#10b981" strokeWidth="12" strokeDasharray={`${tp*3.27} 327`} strokeLinecap="round"/>
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="text-5xl font-black">{tp}%</span>
                            <span className="text-gray-500">مكتمل</span>

                    </div>
                </div>

                {/* تفاصيل القوائم */}
                {s.folders.length>0 && (
                    <div className="space-y-6">
                        <h3 className="text-xl font-bold">تفاصيل القوائم</h3>
                        {s.folders.map(folder=>{
                            const fb=s.books.filter(b=>b.fid===folder.id);
                            const fc=COLORS.find(c=>c.name===folder.color)||COLORS[0];
                            const fp=s.getFolderProgress(folder.id);
                            
                            return (
                                <div key={folder.id} className="glass rounded-2xl p-6">
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className="w-4 h-4 rounded-full" style={{background:fc.val}}/>
                                        <h4 className="font-bold text-lg">{folder.title}</h4>
                                        <span className="text-gray-500 text-sm">({fb.length} كتاب)</span>
                                        <span className="mr-auto font-bold" style={{color:fc.val}}>{fp}%</span>
                                    </div>
                                    
                                    {fb.length>0 ? (
                                        <div className="space-y-3">
                                            {fb.map(book=>{
                                                const bp=s.getBookProgress(book.id);
                                                const bc=COLORS.find(c=>c.name===book.color)||COLORS[0];

                                                    </div>

        </div>

}

// === التطبيق الرئيسي ===
function App() {
    const store = useStore();
    const [page,setPage] = useState('home');
    const [folderId,setFolderId] = useState(null);
    const [bookId,setBookId] = useState(null);

    if(!store.ready) {
        return (
            <div className="min-h-screen bg-[#0a0f1a] flex items-center justify-center">
                <div className="text-center">
                    <div className="w-12 h-12 border-4 border-emerald-500/30 border-t-emerald-500 rounded-full animate-spin mx-auto mb-4"/>
                    <p className="text-gray-400">جاري التحميل...</p>
                </div>
            </div>
        );
    }

    const goHome = ()=>{ setFolderId(null); setBookId(null); setPage('home'); };
    const goFolder = (id)=>{ setFolderId(id); setBookId(null); setPage('folder'); };
    const goBook = (id)=>{ setBookId(id); setPage('book'); };

    // BookCard needs access to goBook - we'll pass it through context or props
    // For now, let's wrap the rendering properly

    return (
        <Ctx.Provider value={store}>
            <div className="min-h-screen bg-[#0a0f1a]" style={{backgroundImage:'radial-gradient(circle at 20% 80%, rgba(16,185,129,.08) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(139,92,246,.08) 0%, transparent 50%)'}}>
                <Nav page={page} setPage={p=>{setFolderId(null);setBookId(null);setPage(p);}}/>
                <main>
                    {page==='home' && <HomePage goFolder={goFolder}/>}
                    {page==='folder' && folderId && <FolderPageInner fid={folderId} onBack={goHome} goBook={goBook}/>}
                    {page==='book' && bookId && <BookPage bid={bookId} onBack={folderId?()=>setPage('folder'):goHome}/>}
                    {page==='progress' && <ProgressPage/>}
                </main>
                <footer className="border-t border-white/5 py-8 mt-12 text-center text-gray-600 text-sm">
                    <p>تتبع التعلم — قائمة • كتاب • درس</p>
                </footer>
            </div>
        </Ctx.Provider>
    );
}

// Wrapper for FolderPage that passes goBook

    const folder = s.folders.find(f=>f.id===fid);

    if(!folder) { useEffect(()=>{ onBack(); },[]); return null; }

    const [bookModal,setBookModal]=useState(false);

    return (
        <div className="min-h-screen pt-20 pb-12 px-4">
            <div className="max-w-6xl mx-auto">
                <div className="glass rounded-2xl p-6 mb-6 anim">
                    <div className="flex items-center gap-4 mb-4">
                        <button onClick={onBack} className="w-11 h-11 rounded-xl bg-white/5 flex items-center justify-center text-gray-400 hover:text-white btn">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                        </button>
                        <div className="flex items-center gap-3 flex-1 min-w-0">
                            <div className="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style={{background:fc.val+'25'}}>
                                <svg className="w-6 h-6" style={{color:fc.val}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                            </div>
                            <div className="min-w-0">
                                <h1 className="text-2xl sm:text-3xl font-black truncate">{folder.title}</h1>
                                <p className="text-gray-400">{folderBooks.length} كتاب • {s.getFolderProgress(fid)}% مكتمل</p>
                            </div>
                        </div>
                        <div className="flex gap-2 shrink-0">
                            <button onClick={()=>setBookModal(true)} className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-violet-500/20 text-violet-400 font-medium hover:bg-violet-500/30 btn">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
                                كتاب
                            </button>
                            <button onClick={()=>{if(confirm('حذف؟')){s.delFolder(fid);onBack();}}} className="w-11 h-11 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center hover:bg-red-500/20 btn">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                    <div className="h-3 bg-black/30 rounded-full overflow-hidden">
                        <div className="h-full rounded-full transition-all duration-500" style={{width:s.getFolderProgress(fid)+'%',background:fc.val}}/>
                    </div>
                </div>

                {folderBooks.length>0 ? (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        {folderBooks.map((b,i)=>(
                            <div key={b.id} onClick={()=>goBook(b.id)} style={{animationDelay:(i*0.08)+'s'}} className="anim">
                                <div className="rounded-2xl p-5 cursor-pointer transition hover:-translate-y-1 hover:shadow-xl" style={{background:(COLORS.find(x=>x.name===b.color)||COLORS[0]).val+'18',border:`1px solid ${(COLORS.find(x=>x.name===b.color)||COLORS[0]).val}40`}}>
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{background:(COLORS.find(x=>x.name===b.color)||COLORS[0]).val+'30'}}>
                                            <svg className="w-5 h-5" style={{color:(COLORS.find(x=>x.name===b.color)||COLORS[0]).val}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                                        </div>
                                        <span className="text-xl font-bold" style={{color:(COLORS.find(x=>x.name===b.color)||COLORS[0]).val}}>{s.getBookProgress(b.id)}%</span>
                                    </div>
                                    <h4 className="font-bold text-base mb-3 line-clamp-2">{b.title}</h4>
                                    <div className="h-2 bg-black/20 rounded-full overflow-hidden">
                                        <div className="h-full rounded-full transition-all duration-500" style={{width:s.getBookProgress(b.id)+'%',background:(COLORS.find(x=>x.name===b.color)||COLORS[0]).val}}/>

                                </div>
                            </div>
                        ))}
                    </div>
                ) : (

                        <p className="text-gray-500 mb-4">لا توجد كتب</p>
                        <button onClick={()=>setBookModal(true)} className="px-6 py-3 rounded-xl bg-violet-500/20 text-violet-400 btn">أضف كتاب</button>
                    </div>
                )}

                <AddBookModal open={bookModal} onClose={()=>setBookModal(false)} onAdd={d=>{s.addBook({...d,fid:fid});setBookModal(false);}} folderName={folder.title}/>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
