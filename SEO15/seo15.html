<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريحة 15 - SEO Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seo15.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">15 / 17</div>

    <!-- Main Container -->
    <div class="slide-container">
        <div class="slide-content">
            <div class="header-section">
                <h1 class="slide-title">خل موقعك يشتغل</h1>
            </div>

            <!-- Comparison Container -->
            <div class="comparison-container">
                <!-- Now Card -->
                <div class="status-card now">
                    <div class="card-header">
                        <div class="card-title">موقعك الآن</div>
                    </div>
                    <ul class="items-list">
                        <li class="item">
                            <span class="arrow-icon"><i class="ph ph-x"></i></span>
                            <span>واجهة جميلة… بس خاملة</span>
                        </li>
                        <li class="item">
                            <span class="arrow-icon"><i class="ph ph-x"></i></span>
                            <span>تعتمد عليك لتجيب عملاء</span>
                        </li>
                    </ul>
                </div>

                <!-- After Card -->
                <div class="status-card after">
                    <div class="card-header">
                        <div class="card-title">بعد SEO</div>
                    </div>
                    <ul class="items-list">
                        <li class="item">
                            <span class="arrow-icon"><i class="ph ph-check"></i></span>
                            <span>آلة جذب عملاء تعمل 24 ساعة</span>
                        </li>
                        <li class="item">
                            <span class="arrow-icon"><i class="ph ph-check"></i></span>
                            <span>استثمار يدر أرباح باستمرار</span>
                        </li>
                        <li class="item">
                            <span class="arrow-icon"><i class="ph ph-check"></i></span>
                            <span>أصل ينمو مع الوقت</span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- CTA Box -->
            <div class="cta-box">
                <p class="cta-question">
                    السؤال:  <span class="cta-emoji">متى تبدأ؟</span>
                </p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
        <button class="nav-btn prev" onclick="location.href='../SEO14/seo14.html'">السابق</button>
        <button class="nav-btn next" onclick="location.href='../SEO16/seo16.html'">التالي</button>
    </div>

    <script>
        // Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                location.href = 'slide_16.html';
            } else if (e.key === 'ArrowLeft') {
                location.href = 'slide_14.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                location.href = 'slide_16.html';
            }
            if (touchEndX > touchStartX + 50) {
                location.href = 'slide_14.html';
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</body>
</html>
