<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريحة 8 - SEO Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seo8.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">8 / 16</div>

    <!-- Main Container -->
    <div class="slide-container">
        <div class="slide-content">
            <div class="header-section">
                <h1 class="slide-title">وش يصير لو عندك SEO قوي؟</h1>
            </div>

            <!-- Benefits Grid -->
            <div class="benefits-grid">
                <div class="benefit-card">
                    <span class="benefit-icon color2"><i class="ph ph-target"></i></span>
                    <div class="benefit-text">ظهور دائم 24/7 في جوجل</div>
                </div>

                <div class="benefit-card">
                    <span class="benefit-icon color1"><i class="ph ph-phone-call"></i></span>
                    <div class="benefit-text">طلبات وتواصل مستمر بدون إعلانات</div>
                </div>

                <div class="benefit-card">
                    <span class="benefit-icon color4"><i class="ph ph-chart-line-up"></i></span>
                    <div class="benefit-text">نمو ثابت ومستمر شهرياً</div>
                </div>

                <div class="benefit-card">
                    <span class="benefit-icon color3"><i class="ph ph-money-wavy"></i></span>
                    <div class="benefit-text">اعتماد أقل على الميزانية الإعلانية</div>
                </div>

                <div class="benefit-card">
                    <span class="benefit-icon color6"><i class="ph ph-trophy"></i></span>
                    <div class="benefit-text">تصدر المنافسة في مجالك</div>
                </div>

                <div class="benefit-card">
                    <span class="benefit-icon color5"><i class="ph ph-calendar-star"></i></span>
                    <div class="benefit-text">بناء علامة تجارية قوية</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
        <button class="nav-btn prev" onclick="location.href='../SEO7/seo7.html'">السابق</button>
        <button class="nav-btn next" onclick="location.href='../SEO9/seo9.html'">التالي</button>
    </div>

    <script>
        // Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                location.href = 'slide_9.html';
            } else if (e.key === 'ArrowLeft') {
                location.href = 'slide_7.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                location.href = 'slide_9.html';
            }
            if (touchEndX > touchStartX + 50) {
                location.href = 'slide_7.html';
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</body>
</html>
