<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريحة 13 - SEO Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seo13.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">13 / 16</div>

    <!-- Main Container -->
    <div class="slide-container">
        <div class="slide-content">
            <div class="header-section">
                <h1 class="slide-title">ليش تختارنا؟</h1>
            </div>

            <!-- Reasons Grid -->
            <div class="reasons-grid">
                <div class="reason-card">
                    <div class="reason-header">
                        <span class="reason-icon color1"><i class="ph ph-graduation-cap"></i></span>
                        <span class="reason-text">خبرة عميقة في السوق السعودي</span>
                    </div>
                </div>

                <div class="reason-card">
                    <div class="reason-header">
                        <span class="reason-icon color2"><i class="ph ph-chart-bar"></i></span>
                        <span class="reason-text">نتائج مثبتة مع مشاريع محلية</span>
                    </div>
                </div>

                <div class="reason-card">
                    <div class="reason-header">
                        <span class="reason-icon color3"><i class="ph ph-map-pin-area"></i></span>
                        <span class="reason-text">فهم احتياجات العملاء في جدة والمملكه</span>
                    </div>
                </div>

                <div class="reason-card">
                    <div class="reason-header">
                        <span class="reason-icon color4"><i class="ph ph-handshake"></i></span>
                        <span class="reason-text">شراكة حقيقية وليس مجرد خدمة</span>
                    </div>
                </div>

                <div class="reason-card">
                    <div class="reason-header">
                        <span class="reason-icon color6"><i class="ph ph-phone-call"></i></span>
                        <span class="reason-text">تواصل مستمر وشفافية كاملة</span>
                    </div>
                </div>

                <div class="reason-card">
                    <div class="reason-header">
                        <span class="reason-icon color5"><i class="ph ph-crosshair"></i></span>
                        <span class="reason-text">تركيز على النتائج لا على الكلام</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
        <button class="nav-btn prev" onclick="location.href='../SEO12/seo12.html'">السابق</button>
        <button class="nav-btn next" onclick="location.href='../SEO14/seo14.html'">التالي</button>
    </div>

    <script>
        // Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                location.href = 'slide_14.html';
            } else if (e.key === 'ArrowLeft') {
                location.href = 'slide_12.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                location.href = 'slide_14.html';
            }
            if (touchEndX > touchStartX + 50) {
                location.href = 'slide_12.html';
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</body>
</html>
