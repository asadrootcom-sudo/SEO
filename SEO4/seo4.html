<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريحة 4 - SEO Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seo4.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">4 / 16</div>

    <!-- Main Container -->
    <div class="slide-container">
        <div class="slide-content">
            <div class="header-section">
                <div class="thinking-icon">🧠</div>
                <h1 class="slide-title">كيف يفكر عميلك؟</h1>
            </div>

            <!-- Scenario Introduction -->
            <div class="scenario-intro">تخيل هذا المشهد:</div>

            <!-- Customer Scenario -->
            <div class="customer-scenario">
                <div class="customer-text">
                    <span class="location-badge">📍 جدة</span>
                    عميل يحتاج شركة تنظيف
                </div>
            </div>

            <!-- Process Steps -->
            <div class="process-section">
                <div class="process-label">ماذا يفعل؟</div>
                <div class="steps-container">
                    <div class="step-item">
                        <span class="step-icon"><i class="ph ph-devices"></i></span>
                        <span class="arrow-icon"><i class="ph ph-arrow-fat-lines-right"></i></span>
                        <span>يفتح جوجل</span>
                    </div>
                    <div class="step-item">
                        <span class="step-icon"><i class="ph ph-keyboard"></i></span>
                        <span class="arrow-icon"><i class="ph ph-arrow-fat-lines-right"></i></span>
                        <span>يكتب: "شركة تنظيف في جدة"</span>
                    </div>
                    <div class="step-item">
                        <span class="step-icon"><i class="ph ph-cursor-click"></i></span>
                        <span class="arrow-icon"><i class="ph ph-arrow-fat-lines-right"></i></span>
                        <span>يضغط على أول 3 نتائج</span>
                    </div>
                    <div class="step-item">
                        <span class="step-icon"><i class="ph ph-phone-call"></i></span>
                        <span class="arrow-icon"><i class="ph ph-arrow-fat-lines-right"></i></span>
                        <span>يتواصل معهم</span>
                    </div>
                </div>
            </div>

            <!-- Question Box -->
            <div class="question-box">
                <div class="question-text">
                     السؤال: أنت وين؟
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
        <button class="nav-btn prev" onclick="location.href='../SEO3/seo3.html'">السابق</button>
        <button class="nav-btn next" onclick="location.href='../SEO5/seo5.html'">التالي</button>
    </div>

    <script>
        // Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                location.href = 'slide_5.html';
            } else if (e.key === 'ArrowLeft') {
                location.href = 'slide_3.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                location.href = 'slide_5.html';
            }
            if (touchEndX > touchStartX + 50) {
                location.href = 'slide_3.html';
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</body>
</html>
